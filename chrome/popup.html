<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>خواندن متن</h1>
      <div class="controls">
        <button id="read">خواندن انتخاب</button>
        <button id="pause">مکث</button>
        <button id="resume">ادامه</button>
        <button id="stop">توقف</button>
      </div>

      <label>
        سرعت
        <input id="rate" type="range" min="0.5" max="2" step="0.1">
        <span id="rateValue"></span>
      </label>

      <label>
        زیر و بمی
        <input id="pitch" type="range" min="0.5" max="2" step="0.1">
        <span id="pitchValue"></span>
      </label>

      <label>
        صدای فارسی
        <select id="faVoice"></select>
      </label>

      <label>
        English voice
        <select id="enVoice"></select>
      </label>

      <label class="check-row">
        <input id="useLocalHelper" type="checkbox">
        <span>استفاده از موتور رایگان محلی</span>
      </label>

      <label>
        مدل فارسی محلی
        <select id="localFaModel"></select>
      </label>

      <label>
        آدرس موتور محلی
        <input id="helperUrl" type="url" dir="ltr">
      </label>

      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
