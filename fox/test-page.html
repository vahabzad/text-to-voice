<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>Selected Text Reader Test</title>
    <style>
      body {
        max-width: 760px;
        margin: 48px auto;
        color: #17202a;
        font-family: Tahoma, Arial, sans-serif;
        line-height: 1.9;
      }

      section {
        margin-bottom: 28px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        padding: 16px;
        border: 1px solid #d8dee9;

        background: #f8fafc;

  <body>
    <h1>صفحه تست اکستنشن متن به صوت</h1>

    </section>

    <section dir="ltr" lang="en">
      <h2>English</h2>
      <p>Hello. This is an English sample text for testing the selected text reader extension in Firefox.</p>
    </section>

</html>
